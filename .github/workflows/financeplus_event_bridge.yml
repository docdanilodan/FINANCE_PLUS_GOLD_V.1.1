name: FinancePlus GitHub event bridge

on:
  pull_request:
    types: [opened, reopened, synchronize, closed, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  notify-financeplus:
    runs-on: ubuntu-latest
    steps:
      - name: Send GitHub event to FinancePlus Event API
        env:
          FINANCEPLUS_EVENT_URL: https://financeplus-events-v2.onrender.com/events/github
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          oidc_token=$(curl --fail --show-error --silent \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=financeplus-events-v2" | jq -r '.value')
          test -n "$oidc_token" && test "$oidc_token" != "null"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            event_type="github.bridge.test"
            external_id="workflow-${RUN_ID}-${RUN_ATTEMPT}"
            title="FinancePlus GitHub bridge test"
            url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
            detail="Manual GitHub event bridge test."
          else
            event_type="github.pull_request.${EVENT_ACTION}"
            external_id="${REPOSITORY}#${PR_NUMBER}-${EVENT_ACTION}"
            title="${PR_TITLE:-Pull request #${PR_NUMBER}}"
            url="$PR_URL"
            detail="GitHub pull request event: ${EVENT_ACTION} on ${REPOSITORY}."
          fi

          payload=$(jq -n \
            --arg event_type "$event_type" \
            --arg external_id "$external_id" \
            --arg detail "$detail URL: $url" \
            --arg correlation_id "github-${RUN_ID}-${RUN_ATTEMPT}" \
            '{external_id:$external_id,event_type:$event_type,detail:$detail,correlation_id:$correlation_id}')

          response_file=$(mktemp)
          http_code="000"
          curl_code=1
          for attempt in 1 2 3; do
            set +e
            http_code=$(curl --show-error --silent \
              --connect-timeout 10 --max-time 50 \
              -o "$response_file" -w "%{http_code}" \
              -X POST "$FINANCEPLUS_EVENT_URL" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $oidc_token" \
              --data "$payload")
            curl_code=$?
            set -e
            if [ "$curl_code" -eq 0 ] && [[ "$http_code" =~ ^2 ]]; then
              cat "$response_file"
              echo
              exit 0
            fi
            echo "FinancePlus event delivery attempt ${attempt} failed (curl=${curl_code}, http=${http_code})."
            sleep $((attempt * 2))
          done

          echo "::warning::FinancePlus Event API unavailable after retries (curl=${curl_code}, http=${http_code}). Telemetry failure does not invalidate the pull request."
          cat "$response_file" || true
          echo
          exit 0
