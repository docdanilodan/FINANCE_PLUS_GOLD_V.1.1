name: Apply client document PDF report

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-client-document-pdf-report.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply patch
        run: python .github/scripts/add_client_document_pdf_report.py

      - name: Validate Python syntax
        run: |
          python -m py_compile FinancePlus_Airtable/streamlit_app.py
          python -m py_compile FinancePlus_Airtable/pdf_reports.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FinancePlus_Airtable/streamlit_app.py FinancePlus_Airtable/pdf_reports.py FinancePlus_Airtable/requirements.txt FinancePlus_Airtable/README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add per-client document summary PDF"
            git push
          fi
