name: FinancePlus MASTER CI
on:
  push:
    branches: [app-nuova-sett-ia-00-master]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q app.py financeplus financeplus_cr_engine
      - run: pytest -q
