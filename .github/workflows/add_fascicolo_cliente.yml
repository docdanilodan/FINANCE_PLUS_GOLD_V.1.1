name: Add Fascicolo Cliente PDF

on:
  push:
    paths:
      - '.github/workflows/add_fascicolo_cliente.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add fascicolo cliente feature
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('FinancePlus_Airtable/streamlit_app.py')
          pdf_path = Path('FinancePlus_Airtable/pdf_reports.py')
          readme_path = Path('FinancePlus_Airtable/README.md')

          app = app_path.read_text(encoding='utf-8')
          pdf = pdf_path.read_text(encoding='utf-8')
          readme = readme_path.read_text(encoding='utf-8')

          import_old = '''from pdf_reports import (\n    build_client_documents_pdf,\n    build_documents_summary_df,\n    safe_pdf_filename,\n)'''
          import_new = '''from pdf_reports import (\n    build_client_documents_pdf,\n    build_client_fascicolo_pdf,\n    build_documents_summary_df,\n    safe_fascicolo_filename,\n    safe_pdf_filename,\n)'''
          if 'build_client_fascicolo_pdf' not in app:
              if import_old not in app:
                  raise SystemExit('Import block pdf_reports non trovato')
              app = app.replace(import_old, import_new, 1)

              anchor = '''    tab_anagrafica, tab_pratiche, tab_documenti, tab_email, tab_analisi = st.tabs(\n'''
              fascicolo_ui = '''    st.markdown("#### 📁 Fascicolo Cliente PDF")\n    st.caption(\n        "Genera un unico dossier con anagrafica, documenti, pratiche, documenti mancanti, email e analisi creditizie."\n    )\n    fascicolo_bytes = build_client_fascicolo_pdf(\n        row.to_dict(),\n        documenti,\n        pratiche,\n        email,\n        analisi,\n    )\n    st.download_button(\n        "📁 Scarica Fascicolo Cliente PDF",\n        data=fascicolo_bytes,\n        file_name=safe_fascicolo_filename(selected_name),\n        mime="application/pdf",\n        key=f"download_fascicolo_pdf_{selected_record_id}",\n        use_container_width=True,\n    )\n    st.caption(\n        f"Contenuto: {len(documenti)} documenti · {len(pratiche)} pratiche · "\n        f"{len(email)} email · {len(analisi)} analisi creditizie."\n    )\n\n'''
              if anchor not in app:
                  raise SystemExit('Anchor tabs cliente non trovato')
              app = app.replace(anchor, fascicolo_ui + anchor, 1)

          if 'def build_client_fascicolo_pdf(' not in pdf:
              pdf += r'''


def safe_fascicolo_filename(client_name: str) -> str:
    slug = re.sub(r"[^A-Za-z0-9]+", "_", str(client_name or "Cliente")).strip("_")
    slug = slug[:90] or "Cliente"
    return f"FinancePlus_Fascicolo_Cliente_{slug}.pdf"


def _fascicolo_footer(canvas, doc) -> None:
    canvas.saveState()
    width, _ = landscape(A4)
    canvas.setStrokeColor(COPPER)
    canvas.setLineWidth(0.7)
    canvas.line(14 * mm, 11 * mm, width - 14 * mm, 11 * mm)
    canvas.setFillColor(MID_GRAY)
    canvas.setFont("Helvetica", 7)
    canvas.drawString(14 * mm, 6.8 * mm, "FinancePlus AI — Fascicolo Cliente")
    canvas.drawRightString(width - 14 * mm, 6.8 * mm, f"Pagina {doc.page}")
    canvas.restoreState()


def build_client_fascicolo_pdf(
    client: Dict[str, Any],
    documents: pd.DataFrame,
    practices: pd.DataFrame,
    emails: pd.DataFrame,
    analyses: pd.DataFrame,
) -> bytes:
    """Genera un fascicolo cliente completo dai record Airtable collegati."""
    from datetime import datetime
    from reportlab.platypus import PageBreak

    def money(value: Any) -> str:
        if _missing(value):
            return "—"
        try:
            return f"€ {float(value):,.2f}".replace(",", "X").replace(".", ",").replace("X", ".")
        except Exception:
            return _text(value)

    def cell(value: Any, style: ParagraphStyle, limit: int | None = None) -> Paragraph:
        text = _text(value)
        if limit and len(text) > limit:
            text = text[: max(0, limit - 1)].rstrip() + "…"
        return Paragraph(escape(text), style)

    def section_title(text: str, style: ParagraphStyle) -> Paragraph:
        return Paragraph(escape(text), style)

    buffer = BytesIO()
    doc = SimpleDocTemplate(
        buffer,
        pagesize=landscape(A4),
        leftMargin=14 * mm,
        rightMargin=14 * mm,
        topMargin=14 * mm,
        bottomMargin=16 * mm,
        title=f"FinancePlus - Fascicolo Cliente - {_text(client.get('Cliente'), 'Cliente')}",
        author="FinancePlus AI",
        subject="Fascicolo cliente: anagrafica, documenti, pratiche, email e analisi creditizie",
    )

    styles = getSampleStyleSheet()
    title_style = ParagraphStyle(
        "FascicoloTitle",
        parent=styles["Title"],
        fontName="Helvetica-Bold",
        fontSize=20,
        leading=23,
        textColor=NAVY,
        alignment=TA_LEFT,
        spaceAfter=4 * mm,
    )
    section_style = ParagraphStyle(
        "FascicoloSection",
        parent=styles["Heading2"],
        fontName="Helvetica-Bold",
        fontSize=12,
        leading=15,
        textColor=NAVY,
        spaceBefore=2 * mm,
        spaceAfter=3 * mm,
    )
    subtitle_style = ParagraphStyle(
        "FascicoloSubtitle",
        parent=styles["Normal"],
        fontName="Helvetica",
        fontSize=8.5,
        leading=11,
        textColor=MID_GRAY,
        spaceAfter=3 * mm,
    )
    label_style = ParagraphStyle(
        "FascicoloLabel",
        parent=styles["Normal"],
        fontName="Helvetica-Bold",
        fontSize=7.6,
        leading=9.2,
        textColor=NAVY,
    )
    value_style = ParagraphStyle(
        "FascicoloValue",
        parent=styles["Normal"],
        fontName="Helvetica",
        fontSize=7.4,
        leading=9.2,
        textColor=colors.HexColor("#202A33"),
    )
    header_style = ParagraphStyle(
        "FascicoloHeader",
        parent=styles["Normal"],
        fontName="Helvetica-Bold",
        fontSize=6.7,
        leading=8,
        textColor=colors.white,
        alignment=TA_CENTER,
    )
    body_style = ParagraphStyle(
        "FascicoloBody",
        parent=styles["Normal"],
        fontName="Helvetica",
        fontSize=6.3,
        leading=7.7,
        textColor=colors.HexColor("#202A33"),
        alignment=TA_LEFT,
    )
    center_style = ParagraphStyle(
        "FascicoloCenter",
        parent=body_style,
        alignment=TA_CENTER,
    )

    story = []
    client_name = _text(client.get("Cliente"), "Cliente")
    story.append(Paragraph("FinancePlus — Fascicolo Cliente", title_style))
    story.append(
        Paragraph(
            f"Cliente: <b>{escape(client_name)}</b> &nbsp;&nbsp; | &nbsp;&nbsp; "
            f"Generato il {datetime.now().strftime('%d/%m/%Y %H:%M')}",
            subtitle_style,
        )
    )

    profile_rows = [
        ["Ragione sociale", client.get("Cliente"), "P.IVA", client.get("Partita IVA"), "Codice fiscale", client.get("Codice Fiscale")],
        ["PEC", client.get("PEC"), "Email", client.get("Email"), "REA", client.get("REA")],
        ["Sede legale", client.get("Sede legale"), "Comune / Provincia", f"{_text(client.get('Comune'))} / {_text(client.get('Provincia'))}", "CAP", client.get("CAP")],
        ["Forma giuridica", client.get("Forma giuridica"), "Stato attività", client.get("Stato attività"), "ATECO", client.get("ATECO")],
        ["Attività prevalente", client.get("Attività prevalente"), "Capitale sociale", money(client.get("Capitale sociale EUR")), "Amministratore", client.get("Rappresentante/Amministratore")],
        ["Ultima visura", _format_date(client.get("Data estrazione visura")), "Ultimo bilancio", client.get("Ultimo bilancio disponibile"), "CR aggiornata al", _format_date(client.get("CR aggiornata al"))],
        ["Rating FinancePlus", client.get("Rating FinancePlus"), "Stato verifica", client.get("Stato verifica anagrafica"), "Stato cliente", client.get("Stato Cliente")],
    ]
    profile_data = []
    for row in profile_rows:
        profile_data.append([
            cell(row[0], label_style), cell(row[1], value_style, 220),
            cell(row[2], label_style), cell(row[3], value_style, 160),
            cell(row[4], label_style), cell(row[5], value_style, 160),
        ])
    profile_table = Table(profile_data, colWidths=[26*mm, 58*mm, 27*mm, 48*mm, 29*mm, 58*mm])
    profile_table.setStyle(TableStyle([
        ("BACKGROUND", (0,0), (-1,-1), colors.white),
        ("BOX", (0,0), (-1,-1), 0.55, BORDER),
        ("INNERGRID", (0,0), (-1,-1), 0.3, BORDER),
        ("BACKGROUND", (0,0), (0,-1), LIGHT_COPPER),
        ("BACKGROUND", (2,0), (2,-1), LIGHT_COPPER),
        ("BACKGROUND", (4,0), (4,-1), LIGHT_COPPER),
        ("VALIGN", (0,0), (-1,-1), "TOP"),
        ("LEFTPADDING", (0,0), (-1,-1), 4),
        ("RIGHTPADDING", (0,0), (-1,-1), 4),
        ("TOPPADDING", (0,0), (-1,-1), 4),
        ("BOTTOMPADDING", (0,0), (-1,-1), 4),
    ]))
    story.extend([profile_table, Spacer(1, 4*mm)])

    counts_data = [
        [cell("Documenti", label_style), cell(len(documents) if documents is not None else 0, value_style),
         cell("Pratiche", label_style), cell(len(practices) if practices is not None else 0, value_style),
         cell("Email", label_style), cell(len(emails) if emails is not None else 0, value_style),
         cell("Analisi creditizie", label_style), cell(len(analyses) if analyses is not None else 0, value_style)]
    ]
    counts = Table(counts_data, colWidths=[25*mm, 18*mm, 23*mm, 18*mm, 20*mm, 18*mm, 35*mm, 18*mm])
    counts.setStyle(TableStyle([
        ("BACKGROUND", (0,0), (-1,-1), LIGHT_BLUE),
        ("BOX", (0,0), (-1,-1), 0.55, BORDER),
        ("INNERGRID", (0,0), (-1,-1), 0.3, BORDER),
        ("VALIGN", (0,0), (-1,-1), "MIDDLE"),
        ("LEFTPADDING", (0,0), (-1,-1), 5),
        ("RIGHTPADDING", (0,0), (-1,-1), 5),
        ("TOPPADDING", (0,0), (-1,-1), 5),
        ("BOTTOMPADDING", (0,0), (-1,-1), 5),
    ]))
    story.extend([counts, Spacer(1, 4*mm)])

    if client.get("Note") and not _missing(client.get("Note")):
        story.append(section_title("Note cliente", section_style))
        story.append(cell(client.get("Note"), value_style, 1800))
        story.append(Spacer(1, 3*mm))

    summary = build_documents_summary_df(documents)
    story.append(section_title("Riepilogo documenti per categoria", section_style))
    if summary.empty:
        story.append(cell("Nessun documento collegato.", value_style))
    else:
        counts_by_type = summary["Tipo"].value_counts().reset_index()
        counts_by_type.columns = ["Tipologia", "N."]
        category_data = [[cell("Tipologia", header_style), cell("N.", header_style)]]
        for _, item in counts_by_type.iterrows():
            category_data.append([cell(item["Tipologia"], body_style), cell(item["N."], center_style)])
        category_table = Table(category_data, colWidths=[90*mm, 20*mm], repeatRows=1)
        category_table.setStyle(TableStyle([
            ("BACKGROUND", (0,0), (-1,0), NAVY),
            ("BOX", (0,0), (-1,-1), 0.5, BORDER),
            ("INNERGRID", (0,0), (-1,-1), 0.3, BORDER),
            ("VALIGN", (0,0), (-1,-1), "TOP"),
            ("LEFTPADDING", (0,0), (-1,-1), 4),
            ("RIGHTPADDING", (0,0), (-1,-1), 4),
            ("TOPPADDING", (0,0), (-1,-1), 4),
            ("BOTTOMPADDING", (0,0), (-1,-1), 4),
        ]))
        story.append(category_table)

    story.append(PageBreak())
    story.append(section_title("Pratiche", section_style))
    if practices is None or practices.empty:
        story.append(cell("Nessuna pratica collegata.", value_style))
    else:
        p_headers = ["Pratica", "Tipo", "Istituto", "Importo", "Stato", "Priorità", "Responsabile", "Scadenza"]
        p_data = [[cell(h, header_style) for h in p_headers]]
        for _, p in practices.iterrows():
            p_data.append([
                cell(p.get("Pratica ID"), body_style),
                cell(p.get("Tipo Pratica"), body_style),
                cell(p.get("Istituto"), body_style),
                cell(money(p.get("Importo Richiesto")), body_style),
                cell(p.get("Stato"), body_style),
                cell(p.get("Priorità"), body_style),
                cell(p.get("Responsabile pratica"), body_style),
                cell(_format_date(p.get("Scadenza")), center_style),
            ])
        p_table = LongTable(p_data, colWidths=[34*mm, 28*mm, 35*mm, 28*mm, 28*mm, 22*mm, 40*mm, 24*mm], repeatRows=1)
        p_table.setStyle(TableStyle([
            ("BACKGROUND", (0,0), (-1,0), NAVY),
            ("BOX", (0,0), (-1,-1), 0.5, BORDER),
            ("INNERGRID", (0,0), (-1,-1), 0.3, BORDER),
            ("VALIGN", (0,0), (-1,-1), "TOP"),
            ("LEFTPADDING", (0,0), (-1,-1), 3),
            ("RIGHTPADDING", (0,0), (-1,-1), 3),
            ("TOPPADDING", (0,0), (-1,-1), 4),
            ("BOTTOMPADDING", (0,0), (-1,-1), 4),
        ]))
        story.append(p_table)
        story.append(Spacer(1, 4*mm))

        story.append(section_title("Controllo completezza e azioni", section_style))
        c_headers = ["Pratica", "Stato documentazione", "Completezza", "Documenti mancanti", "Prossima azione", "Scadenza azione", "Alert / criticità"]
        c_data = [[cell(h, header_style) for h in c_headers]]
        for _, p in practices.iterrows():
            c_data.append([
                cell(p.get("Pratica ID"), body_style),
                cell(p.get("Stato documentazione"), body_style),
                cell(p.get("Completezza dossier"), center_style),
                cell(p.get("Documenti mancanti"), body_style, 600),
                cell(p.get("Prossima azione"), body_style, 600),
                cell(_format_date(p.get("Scadenza prossima azione")), center_style),
                cell(p.get("Alert e criticità"), body_style, 700),
            ])
        c_table = LongTable(c_data, colWidths=[31*mm, 31*mm, 24*mm, 55*mm, 55*mm, 28*mm, 55*mm], repeatRows=1)
        c_table.setStyle(TableStyle([
            ("BACKGROUND", (0,0), (-1,0), COPPER),
            ("BOX", (0,0), (-1,-1), 0.5, BORDER),
            ("INNERGRID", (0,0), (-1,-1), 0.3, BORDER),
            ("VALIGN", (0,0), (-1,-1), "TOP"),
            ("LEFTPADDING", (0,0), (-1,-1), 3),
            ("RIGHTPADDING", (0,0), (-1,-1), 3),
            ("TOPPADDING", (0,0), (-1,-1), 4),
            ("BOTTOMPADDING", (0,0), (-1,-1), 4),
        ]))
        story.append(c_table)

    story.append(PageBreak())
    story.append(section_title("Archivio documentale completo", section_style))
    if summary.empty:
        story.append(cell("Nessun documento collegato.", value_style))
    else:
        d_headers = ["N.", "Tipo", "Esercizio", "Data", "Documento", "Pratica", "Origine", "Stato", "Drive"]
        d_data = [[cell(h, header_style) for h in d_headers]]
        for _, d in summary.iterrows():
            drive_url = d.get("Drive")
            if drive_url:
                safe_url = escape(str(drive_url), {'"': '&quot;'})
                drive_cell = Paragraph(f'<link href="{safe_url}" color="#0B5CAD"><u>Apri</u></link>', center_style)
            else:
                drive_cell = cell("—", center_style)
            d_data.append([
                cell(d.get("N."), center_style), cell(d.get("Tipo"), body_style), cell(d.get("Esercizio"), center_style),
                cell(d.get("Data"), center_style), cell(d.get("Documento"), body_style), cell(d.get("Pratica"), body_style),
                cell(d.get("Origine"), body_style), cell(d.get("Stato"), body_style), drive_cell,
            ])
        d_table = LongTable(d_data, colWidths=[8*mm, 27*mm, 18*mm, 22*mm, 86*mm, 28*mm, 24*mm, 26*mm, 18*mm], repeatRows=1)
        d_table.setStyle(TableStyle([
            ("BACKGROUND", (0,0), (-1,0), NAVY),
            ("BOX", (0,0), (-1,-1), 0.5, BORDER),
            ("INNERGRID", (0,0), (-1,-1), 0.3, BORDER),
            ("VALIGN", (0,0), (-1,-1), "TOP"),
            ("LEFTPADDING", (0,0), (-1,-1), 3),
            ("RIGHTPADDING", (0,0), (-1,-1), 3),
            ("TOPPADDING", (0,0), (-1,-1), 4),
            ("BOTTOMPADDING", (0,0), (-1,-1), 4),
        ]))
        story.append(d_table)

    story.append(PageBreak())
    story.append(section_title("Email collegate", section_style))
    if emails is None or emails.empty:
        story.append(cell("Nessuna email collegata.", value_style))
    else:
        work_emails = emails.copy()
        work_emails["_sort_date"] = pd.to_datetime(work_emails.get("Data e ora"), errors="coerce")
        work_emails = work_emails.sort_values("_sort_date", ascending=False, na_position="last")
        e_headers = ["Data", "Mittente", "Oggetto", "Priorità", "Azione richiesta", "Allegati", "Gestita", "Sintesi IA"]
        e_data = [[cell(h, header_style) for h in e_headers]]
        for _, e in work_emails.iterrows():
            e_data.append([
                cell(_format_date(e.get("Data e ora")), center_style),
                cell(e.get("Mittente"), body_style, 180),
                cell(e.get("Oggetto"), body_style, 260),
                cell(e.get("Priorità"), center_style),
                cell(e.get("Azione Richiesta"), body_style, 450),
                cell(e.get("Allegati"), body_style, 350),
                cell(e.get("Gestita"), center_style),
                cell(e.get("Sintesi IA"), body_style, 850),
            ])
        e_table = LongTable(e_data, colWidths=[24*mm, 36*mm, 55*mm, 21*mm, 48*mm, 42*mm, 20*mm, 58*mm], repeatRows=1)
        e_table.setStyle(TableStyle([
            ("BACKGROUND", (0,0), (-1,0), NAVY),
            ("BOX", (0,0), (-1,-1), 0.5, BORDER),
            ("INNERGRID", (0,0), (-1,-1), 0.3, BORDER),
            ("VALIGN", (0,0), (-1,-1), "TOP"),
            ("LEFTPADDING", (0,0), (-1,-1), 3),
            ("RIGHTPADDING", (0,0), (-1,-1), 3),
            ("TOPPADDING", (0,0), (-1,-1), 4),
            ("BOTTOMPADDING", (0,0), (-1,-1), 4),
        ]))
        story.append(e_table)

    story.append(PageBreak())
    story.append(section_title("Analisi creditizie", section_style))
    if analyses is None or analyses.empty:
        story.append(cell("Nessuna analisi creditizia collegata.", value_style))
    else:
        work_analyses = analyses.copy()
        work_analyses["_sort_date"] = pd.to_datetime(work_analyses.get("Data Analisi"), errors="coerce")
        work_analyses = work_analyses.sort_values("_sort_date", ascending=False, na_position="last")
        a_headers = ["Data", "Esercizio", "Ricavi", "EBITDA", "EBITDA %", "PFN", "PFN/EBITDA", "DSCR", "Score", "Rating", "Sostenibile min", "Sostenibile max"]
        a_data = [[cell(h, header_style) for h in a_headers]]
        for _, a in work_analyses.iterrows():
            a_data.append([
                cell(_format_date(a.get("Data Analisi")), center_style),
                cell(_format_year(a.get("Esercizio")), center_style),
                cell(money(a.get("Ricavi")), body_style),
                cell(money(a.get("EBITDA")), body_style),
                cell(a.get("EBITDA Margin"), center_style),
                cell(money(a.get("PFN")), body_style),
                cell(a.get("PFN EBITDA"), center_style),
                cell(a.get("DSCR"), center_style),
                cell(a.get("Score"), center_style),
                cell(a.get("Rating"), center_style),
                cell(money(a.get("Importo Sostenibile Min")), body_style),
                cell(money(a.get("Importo Sostenibile Max")), body_style),
            ])
        a_table = LongTable(a_data, colWidths=[23*mm, 18*mm, 27*mm, 27*mm, 20*mm, 27*mm, 24*mm, 19*mm, 18*mm, 18*mm, 31*mm, 31*mm], repeatRows=1)
        a_table.setStyle(TableStyle([
            ("BACKGROUND", (0,0), (-1,0), NAVY),
            ("BOX", (0,0), (-1,-1), 0.5, BORDER),
            ("INNERGRID", (0,0), (-1,-1), 0.3, BORDER),
            ("VALIGN", (0,0), (-1,-1), "TOP"),
            ("LEFTPADDING", (0,0), (-1,-1), 3),
            ("RIGHTPADDING", (0,0), (-1,-1), 3),
            ("TOPPADDING", (0,0), (-1,-1), 4),
            ("BOTTOMPADDING", (0,0), (-1,-1), 4),
        ]))
        story.extend([a_table, Spacer(1, 4*mm)])

        for _, a in work_analyses.iterrows():
            ident = f"Analisi {_format_date(a.get('Data Analisi'))} — Rating {_text(a.get('Rating'))}"
            story.append(Paragraph(f"<b>{escape(ident)}</b>", subtitle_style))
            details = [
                ["Punti di forza", a.get("Punti di Forza")],
                ["Criticità", a.get("Criticità")],
                ["Raccomandazione IA", a.get("Raccomandazione IA")],
            ]
            detail_data = [[cell(k, label_style), cell(v, value_style, 1400)] for k, v in details]
            detail_table = Table(detail_data, colWidths=[38*mm, 220*mm])
            detail_table.setStyle(TableStyle([
                ("BACKGROUND", (0,0), (0,-1), LIGHT_COPPER),
                ("BOX", (0,0), (-1,-1), 0.45, BORDER),
                ("INNERGRID", (0,0), (-1,-1), 0.25, BORDER),
                ("VALIGN", (0,0), (-1,-1), "TOP"),
                ("LEFTPADDING", (0,0), (-1,-1), 4),
                ("RIGHTPADDING", (0,0), (-1,-1), 4),
                ("TOPPADDING", (0,0), (-1,-1), 4),
                ("BOTTOMPADDING", (0,0), (-1,-1), 4),
            ]))
            story.extend([detail_table, Spacer(1, 3*mm)])

    story.extend([
        Spacer(1, 4*mm),
        Paragraph(
            "Il Fascicolo Cliente riflette esclusivamente i dati presenti nelle tabelle Airtable collegate al momento della generazione. "
            "I campi mancanti restano indicati con — e non vengono ricostruiti o inventati.",
            subtitle_style,
        ),
    ])

    doc.build(story, onFirstPage=_fascicolo_footer, onLaterPages=_fascicolo_footer)
    return buffer.getvalue()
'''

          marker = '## Fascicolo Cliente PDF'
          if marker not in readme:
              readme += '''\n\n## Fascicolo Cliente PDF\n\nDalla scheda **Clienti** e disponibile anche **Scarica Fascicolo Cliente PDF**. Il dossier viene generato al momento dai record Airtable collegati e comprende:\n\n- anagrafica camerale e dati identificativi;\n- rating, ultimo bilancio, Centrale Rischi e stato verifica;\n- conteggio e riepilogo documenti per categoria;\n- elenco completo dei documenti con link Drive;\n- pratiche, stato documentazione, completezza, documenti mancanti, prossime azioni, scadenze e alert;\n- email collegate con priorita, azione richiesta, allegati e sintesi IA;\n- analisi creditizie con KPI, score, rating, importi sostenibili, punti di forza, criticita e raccomandazioni.\n\nI campi non presenti restano vuoti/`—`: il report non ricostruisce dati mancanti.\n'''

          app_path.write_text(app, encoding='utf-8')
          pdf_path.write_text(pdf, encoding='utf-8')
          readme_path.write_text(readme, encoding='utf-8')
          PY

      - name: Syntax check
        run: |
          python -m py_compile FinancePlus_Airtable/streamlit_app.py FinancePlus_Airtable/pdf_reports.py

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "FinancePlus Automation"
          git config user.email "actions@users.noreply.github.com"
          git add FinancePlus_Airtable/streamlit_app.py FinancePlus_Airtable/pdf_reports.py FinancePlus_Airtable/README.md
          if git diff --cached --quiet; then
