name: Add Fascicolo Cliente PDF

on:
  push:
    paths:
      - '.github/workflows/add_fascicolo_cliente.yml'
      - 'FinancePlus_Airtable/patch_fascicolo_app.py'
      - 'FinancePlus_Airtable/client_fascicolo.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply integration patch
        run: python FinancePlus_Airtable/patch_fascicolo_app.py

      - name: Syntax check
        run: python -m py_compile FinancePlus_Airtable/streamlit_app.py FinancePlus_Airtable/client_fascicolo.py FinancePlus_Airtable/pdf_reports.py

      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "FinancePlus Automation"
          git config user.email "actions@users.noreply.github.com"
          git add FinancePlus_Airtable/streamlit_app.py FinancePlus_Airtable/README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Integrate full client dossier PDF"
            git push
          fi
