name: FinancePlus Drive classification sync

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Reconcile Google Drive labels with FinancePlus policy
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON_STUDIO: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_STUDIO }}
          GOOGLE_OAUTH_TOKEN_JSON_PRATICHE: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_PRATICHE }}
          FINANCEPLUS_GOOGLE_PROFILES: ${{ secrets.FINANCEPLUS_GOOGLE_PROFILES }}
          FINANCEPLUS_DRIVE_LABEL_MAP_JSON: ${{ secrets.FINANCEPLUS_DRIVE_LABEL_MAP_JSON }}
        run: python -m scripts.sync_drive_classification
