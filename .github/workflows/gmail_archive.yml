name: FinancePlus automatic Gmail archive

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check Gmail archive configuration
        id: config
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON_STUDIO: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_STUDIO }}
          GOOGLE_OAUTH_TOKEN_JSON_PRATICHE: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_PRATICHE }}
        shell: bash
        run: |
          if [ -z "$AIRTABLE_TOKEN" ]; then
            echo "::notice::Gmail archive inactive: add AIRTABLE_TOKEN to GitHub Actions Secrets."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$GOOGLE_OAUTH_TOKEN_JSON" ] && [ -z "$GOOGLE_OAUTH_TOKEN_JSON_STUDIO" ] && [ -z "$GOOGLE_OAUTH_TOKEN_JSON_PRATICHE" ]; then
            echo "::notice::Gmail archive inactive: add at least one GOOGLE_OAUTH_TOKEN_JSON secret."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.config.outputs.configured == 'true'
        run: pip install -r requirements.txt

      - name: Archive new Gmail attachments from all configured profiles
        if: steps.config.outputs.configured == 'true'
        env:
          # Make repository packages importable when the script is run directly.
          PYTHONPATH: ${{ github.workspace }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON_STUDIO: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_STUDIO }}
          GOOGLE_OAUTH_TOKEN_JSON_PRATICHE: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_PRATICHE }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_FOLDER_ID_STUDIO: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID_STUDIO }}
          GOOGLE_DRIVE_FOLDER_ID_PRATICHE: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID_PRATICHE }}
          FINANCEPLUS_GOOGLE_PROFILES: ${{ secrets.FINANCEPLUS_GOOGLE_PROFILES }}
          FINANCEPLUS_DRIVE_LABEL_MAP_JSON: ${{ secrets.FINANCEPLUS_DRIVE_LABEL_MAP_JSON }}
          PDF_SERVICES_CLIENT_ID: ${{ secrets.PDF_SERVICES_CLIENT_ID }}
          PDF_SERVICES_CLIENT_SECRET: ${{ secrets.PDF_SERVICES_CLIENT_SECRET }}
          FINANCEPLUS_PDF_EXTRACTOR: "auto"
          FINANCEPLUS_ADOBE_ALLOW_CONFIDENTIAL: ${{ secrets.FINANCEPLUS_ADOBE_ALLOW_CONFIDENTIAL }}
          FINANCEPLUS_GMAIL_QUERY: "has:attachment newer_than:2d -in:spam -in:trash"
          FINANCEPLUS_MAX_MESSAGES: "100"
        run: python scripts/sync_gmail_archive.py

      - name: Send Gmail event to FinancePlus Event API
        if: steps.config.outputs.configured == 'true'
        env:
          FINANCEPLUS_EVENT_URL: https://financeplus-events-v2.onrender.com/events/gmail
        shell: bash
        run: |
          oidc_token=$(curl --fail --show-error --silent \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=financeplus-events-v2" | jq -r '.value')
          test -n "$oidc_token" && test "$oidc_token" != "null"

          payload=$(jq -n \
            --arg event_type "gmail.archive.completed" \
            --arg external_id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --arg detail "Gmail attachment synchronization completed for configured Google profiles. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg correlation_id "gmail-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            '{external_id:$external_id,event_type:$event_type,detail:$detail,correlation_id:$correlation_id}')

          response_file=$(mktemp)
          http_code="000"
          curl_code=1
          for attempt in 1 2 3; do
            set +e
            http_code=$(curl --show-error --silent \
              --connect-timeout 10 --max-time 50 \
              -o "$response_file" -w "%{http_code}" \
              -X POST "$FINANCEPLUS_EVENT_URL" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $oidc_token" \
              --data "$payload")
            curl_code=$?
            set -e
            if [ "$curl_code" -eq 0 ] && [[ "$http_code" =~ ^2 ]]; then
              cat "$response_file"
              echo
              exit 0
            fi
            echo "FinancePlus event delivery attempt ${attempt} failed (curl=${curl_code}, http=${http_code})."
            sleep $((attempt * 2))
          done

          echo "::warning::FinancePlus Event API unavailable after retries (curl=${curl_code}, http=${http_code}). Telemetry failure does not invalidate the Gmail archive."
          cat "$response_file" || true
          echo
          exit 0
